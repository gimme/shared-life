plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Forge Config API Port provides NeoForge's config system on Fabric.
    // modImplementation (not implementation) so Loom remaps it; exclude its transitive Fabric API
    // since we already declare a remapped one above.
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // Dev-only Fabric game test API. It is not bundled in the main fabric-api jar, so request the
    // submodule version that matches our fabric-api release explicitly.
    modImplementation fabricApi.module("fabric-gametest-api-v1", fabric_version)
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    // Loom groups each source set as its own dev-classpath mod; the gametest mod stays out of the jar.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            source sourceSets.gametest
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            // Fabric API's headless runner + JUnit report. Run: ./gradlew :fabric:runGametest
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('junit.xml').get().asFile}")
        }
    }
}

tasks.named('check') { dependsOn 'runGametest' }
